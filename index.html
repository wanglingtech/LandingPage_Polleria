      try {
        if (typeof window !== 'undefined' && window.fetch) {
          let _fetch = window.fetch.bind(window);

            get() {
              return _fetch;
            },
            set(newFetch) {
              _fetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (err) {
        // Continue if defineProperty is not allowed
      }
    </script>
